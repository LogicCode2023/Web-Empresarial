{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fs-5"><i class="bi bi-envelope-paper me-2"></i> Redactar Correo Corporativo</h4>
        </div>
        <div class="card-body p-4">

            <div class="alert alert-info py-2 small mb-4">
                Remitente activo: <strong>{{ remitente_correo }}</strong>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Para:</label>
                    {{ form.destinatario }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Asunto:</label>
                    {{ form.asunto }}
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Mensaje:</label>
                    {{ form.mensaje }}
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fs-6">
                        <i class="bi bi-send me-1"></i> Enviar Mensaje
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
