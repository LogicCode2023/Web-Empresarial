<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Portium Group</title>
    <!-- Tus estilos y Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f1f5f9; font-family: inherit;">

<!-- Barra superior exclusiva de administración -->
<nav class="navbar navbar-dark bg-dark px-4 py-2">
    <a class="navbar-brand fw-bold" href="{% url 'dashboard_tramites' %}">Portium Group | Panel Operativo</a>

    <div class="ms-auto d-flex align-items-center gap-2">
        <!-- Botón para ir al panel de gestión de aliados -->
        {% if request.resolver_match.url_name == 'dashboard_tramites' %}
        <a href="{% url 'lista_aliados' %}"
           style="background-color: #0f172a; color: #ffffff; padding: 6px 12px; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; border: 1px solid #334155;">
            ⚙️ Gestionar Aliados
        </a>
        {% endif %}

        <!-- Botón de acceso directo a la Bandeja de Correos -->
        <a href="{% url 'bandeja_correos' %}" class="btn btn-info btn-sm fw-bold" style="background-color: #0284c7; border: none; color: white;">
            <i class="fas fa-inbox"></i> Bandeja
        </a>

        <!-- Botón de Redactar Correo -->
        <a href="{% url 'redactar_correo' %}" class="btn btn-primary btn-sm fw-bold" style="background-color: #0d2346; border: none;">
            <i class="fas fa-paper-plane"></i> Redactar
        </a>

        <span class="text-white ms-2">Hola, {{ request.user.username }}</span>

        <form method="post" action="{% url 'custom_admin_logout' %}" style="display: inline; margin: 0;">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<!-- Contenido Principal Operativo -->
<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>

<!-- Bootstrap JS Bundle (Necesario para los modales) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
